<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory - NexusUser Portal</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Toastify Notification Styling -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <div class="container-fluid p-0">
    <!-- flex-column on mobile, flex-md-row on desktop -->
    <div class="d-flex flex-column flex-md-row min-vh-100">
      
      <!-- 1. SIDEBAR CONTAINER -->
      <div id="sidebar-container" class="col-12 col-md-3 col-lg-2 bg-dark p-0"></div>

      <!-- 2. MAIN CONTENT AREA -->
      <main class="col-12 col-md-9 col-lg-10 px-3 px-md-4 py-4 w-100">
        
        <!-- Page Header -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center border-bottom pb-3 mb-4 gap-2">
          <h1 class="h2 fw-bold m-0 text-dark">User Directory</h1>
          <a href="/pages/user-add.html" class="btn btn-primary d-inline-flex align-items-center gap-1 shadow-sm self-start">
            <i class="bi bi-plus-lg"></i>
            <span>Add User</span>
          </a>
        </div>

        <!-- Table Card Wrapper -->
        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
          
          <div class="card-header bg-white py-3 border-0">
            <h5 class="m-0 fw-bold text-dark">System Records</h5>
          </div>

          <!-- Responsive Table Wrapper -->
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light text-nowrap">
                <tr>
                  <th scope="col" class="ps-4 py-3">User Details</th>
                  <th scope="col" class="py-3">Role Assigned</th>
                  <th scope="col" class="py-3">Current Status</th>
                  <th scope="col" class="py-3">Joined Date</th>
                  <th scope="col" class="text-end pe-4 py-3">System Actions</th>
                </tr>
              </thead>
              <tbody id="user-table-body">
                <tr>
                  <td colspan="5" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                    Loading users from database...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>

      </main>

    </div>
  </div>

  <!-- JS Dependencies -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="/js/app.js"></script> 
</body>
</html>
