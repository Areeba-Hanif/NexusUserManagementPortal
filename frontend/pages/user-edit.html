<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User - AdminPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      
      <!-- Sidebar -->
   <div id="sidebar-container" class="col-md-3 col-lg-2 p-0 bg-dark"></div>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="card border-warning border-top border-4 shadow-sm">
          <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-0">
            <h5 class="m-0 fw-bold">
              <i class="bi bi-pencil-square text-warning me-2"></i>Edit Profile: <span id="user-display-name">Loading...</span>
            </h5>
            <span class="badge bg-light text-dark" id="user-id-badge">ID: --</span>
          </div>
          <div class="card-body">
            
          
            <form id="edit-user-form">
             
              <input type="hidden" id="userId">

              <div class="row g-3">
                <div class="col-sm-6">
                  <label class="form-label small fw-semibold">First Name</label>
                  <input type="text" id="firstName" class="form-control" required>
                </div>
                <div class="col-sm-6">
                  <label class="form-label small fw-semibold">Last Name</label>
                  <input type="text" id="lastName" class="form-control" >
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Primary Email Address</label>
                  <input type="email" id="email" class="form-control" required>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Change System Role</label>
                  <select id="role" class="form-select">
                    <option value="Standard User">Standard User</option>
                    <option value="Moderator">Moderator</option>
                    <option value="External Guest">External Guest</option>
                    <option value="System Admin">System Admin</option>
                  </select>
                </div>
              </div>
              <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                <a href="user-list.html" class="btn btn-sm btn-outline-secondary px-3">Discard</a>
                <button type="submit" id="update-btn" class="btn btn-sm btn-warning px-3 fw-semibold">Update Information</button>
              </div>
            </form>

          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- Required Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="/js/app.js"></script> 
</body>
</html>
