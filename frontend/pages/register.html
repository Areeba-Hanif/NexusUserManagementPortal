<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Profile - NexusUser Portal</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Toastify Notification Styling -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card border-0 shadow-lg p-4 p-md-5 w-100" style="max-width: 440px; border-radius: 16px;">
    
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="bg-primary text-white rounded-4 d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 56px; height: 56px;">
        <i class="bi bi-shield-fill-check fs-2"></i>
      </div>
      <h2 class="h3 fw-bold text-dark mb-1">NexusUser Portal</h2>
      <p class="text-muted small">Create your new user account</p>
    </div>

    <!-- Registration Form -->
    <form id="register-form">
      <div class="mb-3">
        <label for="full-name" class="form-label text-uppercase fw-semibold text-secondary" style="font-size: 0.75rem; letter-spacing: 0.5px;">Full Name</label>
        <input type="text" id="full-name" class="form-control form-control-lg fs-6 py-2 px-3" placeholder="John Doe" required>
      </div>

      <div class="mb-3">
        <label for="register-email" class="form-label text-uppercase fw-semibold text-secondary" style="font-size: 0.75rem; letter-spacing: 0.5px;">Email Address</label>
        <input type="email" id="register-email" class="form-control form-control-lg fs-6 py-2 px-3" placeholder="name@aegis.com" required>
      </div>

      <div class="mb-4">
        <label for="register-password" class="form-label text-uppercase fw-semibold text-secondary" style="font-size: 0.75rem; letter-spacing: 0.5px;">Password</label>
        <input type="password" id="register-password" class="form-control form-control-lg fs-6 py-2 px-3" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold fs-6 py-2 shadow-sm">
        Register Platform Profile
      </button>
    </form>

    <!-- Footer Redirect Link -->
    <div class="text-center mt-4 pt-3 border-top">
      <p class="small text-muted mb-0">
        Already registered? 
        <a href="/pages/login.html" class="text-primary text-decoration-none fw-semibold ms-1">Sign In instead</a>
      </p>
    </div>

  </div>

  <!-- JS Dependencies -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
