<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Detail - AdminPortal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      
      <!-- Sidebar Navigation -->
     <div id="sidebar-container" class="col-md-3 col-lg-2 p-0 bg-dark"></div>

      <!-- Main Content Area -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4" id="user-detail-card">
        <div class="mb-3">
          <a href="user-list.html" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Directory
          </a>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="card border-0 shadow-sm">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-3">
                  <h5 class="fw-bold m-0">
                    <i class="bi bi-person-badge text-primary me-2"></i>User Profile Card
                  </h5>
                  <span class="badge bg-success">Active</span>
                </div>

                <div class="text-center py-3 border-bottom mb-3">
                  <div class="bg-secondary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 72px; height: 72px;">
                    <span class="fs-3 fw-bold" id="detail-user-avatar">--</span>
                  </div>
                  <h5 class="fw-bold mb-0" id="detail-user-name">Loading...</h5>
                  <p class="text-muted small mb-0" id="detail-user-id">ID: #---</p>
                </div>

                <div class="row g-2 small">
                  <div class="col-4 text-secondary">Email:</div>
                  <div class="col-8 fw-semibold" id="detail-user-email">--</div>

                  <div class="col-4 text-secondary">Assigned Role:</div>
                  <div class="col-8">
                    <span class="badge bg-secondary" id="detail-user-role">--</span>
                  </div>

                  <div class="col-4 text-secondary">Joined Date:</div>
                  <div class="col-8" id="detail-user-joined">--</div>

                  <div class="col-4 text-secondary">Last Active:</div>
                  <div class="col-8 text-success">Just Now</div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                  <a href="#" id="edit-profile-btn" class="btn btn-sm btn-warning fw-semibold px-3">
                    <i class="bi bi-pencil me-1"></i> Edit Profile
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
